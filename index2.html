

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weatherly | Weather Dashboard</title>

<style>
/* ================= GENERAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    min-height: 100vh;
    background:
        radial-gradient(ellipse at 15% 10%, #244d85 0%, transparent 40%),
        radial-gradient(ellipse at 90% 80%, #252b69 0%, transparent 40%),
        #10182d;
    padding: 35px 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

/* ================= HEADER ================= */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 35px;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #72baff;
}

.header-date {
    color: #b7c5df;
    font-size: 14px;
}

/* ================= SEARCH ================= */

.search-area {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.search-area input {
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 16px 20px;
    border-radius: 14px;
    color: white;
    font-size: 15px;
    outline: none;
}

.search-area input::placeholder {
    color: #a8b8d0;
}

.search-area input:focus {
    border-color: #72baff;
}

.search-area button {
    border: none;
    padding: 0 22px;
    border-radius: 14px;
    background: #69aef5;
    color: #10182d;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.search-area button:hover {
    background: #a1d2ff;
    transform: translateY(-2px);
}

.search-area button:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* ================= MAIN WEATHER ================= */

.main-card {
    background: linear-gradient(
        120deg,
        rgba(76,139,219,0.35),
        rgba(255,255,255,0.07)
    );
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    padding: 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 270px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.15);
    margin-bottom: 25px;
}

.location {
    color: #d2e3ff;
    font-size: 16px;
    margin-bottom: 12px;
}

.temperature {
    font-size: clamp(65px, 10vw, 100px);
    font-weight: 700;
    letter-spacing: -5px;
}

.condition {
    font-size: 20px;
    color: #d4e6ff;
    margin-top: 5px;
}

.feels {
    color: #b9c9e2;
    margin-top: 12px;
    font-size: 14px;
}

.weather-visual {
    text-align: center;
}

.weather-icon {
    font-size: 110px;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
}

.weather-visual p {
    color: #c9d9f2;
    font-size: 13px;
    margin-top: 10px;
}

/* ================= SECTION TITLES ================= */

.section-title {
    font-size: 18px;
    margin: 30px 0 16px;
    font-weight: 650;
}

/* ================= HOURLY FORECAST ================= */

.hourly {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
}

.hour-card {
    text-align: center;
    padding: 18px 5px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 15px;
    transition: 0.2s;
}

.hour-card:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-4px);
}

.hour-card p {
    font-size: 12px;
    color: #b8c8e1;
}

.hour-icon {
    font-size: 27px;
    margin: 12px 0;
}

.hour-temp {
    font-weight: 700;
    font-size: 15px;
}

/* ================= LOWER DASHBOARD ================= */

.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 25px;
}

.panel {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 22px;
}

.panel h3 {
    font-size: 17px;
    margin-bottom: 20px;
}

/* 5-day forecast */

.forecast-row {
    display: grid;
    grid-template-columns: 1fr 45px 1fr 1fr;
    align-items: center;
    gap: 10px;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
}

.forecast-row:last-child {
    border: none;
}

.forecast-row .day {
    color: #d5e1f4;
}

.forecast-row .icon {
    font-size: 23px;
}

.forecast-row .condition-text {
    color: #aabbd4;
}

.forecast-row .temps {
    text-align: right;
    white-space: nowrap;
    font-weight: 600;
}

/* Weather details */

.details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
}

.detail-item {
    background: rgba(255,255,255,0.06);
    border-radius: 13px;
    padding: 17px;
}

.detail-item .label {
    font-size: 12px;
    color: #afc0d9;
    margin-bottom: 10px;
}

.detail-item .value {
    font-size: 21px;
    font-weight: 700;
}

.detail-item .symbol {
    font-size: 22px;
    margin-bottom: 9px;
}

/* ================= SUN INFORMATION ================= */

.sun-panel {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.sun-item {
    background: rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 18px;
}

.sun-item p {
    color: #b5c8e3;
    font-size: 13px;
    margin-bottom: 8px;
}

.sun-item h3 {
    font-size: 21px;
}

/* ================= STATUS AND FOOTER ================= */

#message {
    text-align: center;
    margin: 15px 0;
    color: #ffd88c;
    font-size: 14px;
}

#app-content[hidden] {
    display: none;
}

footer {
    text-align: center;
    color: #8ea2c0;
    margin-top: 35px;
    font-size: 12px;
}

footer span {
    color: #76baff;
}

[hidden] {
    display: none !important;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 750px) {
    body {
        padding: 20px 13px;
    }

    .hourly {
        grid-template-columns: repeat(4, 1fr);
    }

    .main-card {
        padding: 25px 18px;
    }

    .weather-icon {
        font-size: 75px;
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 450px) {
    header {
        align-items: flex-start;
        flex-direction: column;
    }

    .search-area {
        flex-wrap: wrap;
    }

    .search-area input {
        width: 100%;
        flex-basis: 100%;
    }

    .search-area button {
        flex: 1;
        min-height: 45px;
    }

    .main-card {
        min-height: 220px;
    }

    .temperature {
        font-size: 58px;
    }

    .condition {
        font-size: 15px;
    }

    .weather-icon {
        font-size: 58px;
    }

    .forecast-row {
        grid-template-columns: 1fr 35px 1fr auto;
        gap: 5px;
    }

    .forecast-row .condition-text {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Application header -->
    <header>
        <div class="logo">Weather<span>ly.</span> ☁</div>
        <div class="header-date" id="today"></div>
    </header>

    <!-- Search area -->
    <form class="search-area" id="search-form">
        <input
            type="text"
            id="city-input"
            placeholder="Search for a city... (e.g. Mumbai)"
            aria-label="Search city"
            required
        >
        <button type="submit" id="search-btn">Search ↗</button>
        <button type="button" id="location-btn">📍 My Location</button>
    </form>

    <!-- Loading and error messages -->
    <p id="message" role="status" aria-live="polite">
        Search for a city to see its weather.
    </p>

    <!-- All weather information -->
    <div id="app-content" hidden>

        <!-- Current weather -->
        <section class="main-card">

            <div>
                <p class="location" id="city-name"></p>
                <div class="temperature" id="temperature">--°</div>
                <p class="condition" id="condition"></p>
                <p class="feels" id="feels"></p>
            </div>

            <div class="weather-visual">
                <div class="weather-icon" id="main-icon">☀️</div>
                <p id="local-time"></p>
            </div>

        </section>

        <!-- Hourly forecast -->
        <h2 class="section-title">Hourly Forecast</h2>
        <section class="hourly" id="hourly"></section>

        <!-- Forecast and weather details -->
        <div class="dashboard-grid">

            <section class="panel">
                <h3>📅 5-Day Forecast</h3>
                <div id="forecast"></div>
            </section>

            <section class="panel">
                <h3>🌡 Weather Details</h3>

                <div class="details-grid">

                    <div class="detail-item">
                        <div class="symbol">💧</div>
                        <p class="label">Humidity</p>
                        <div class="value" id="humidity">--</div>
                    </div>

                    <div class="detail-item">
                        <div class="symbol">💨</div>
                        <p class="label">Wind Speed</p>
                        <div class="value" id="wind">--</div>
                    </div>

                    <div class="detail-item">
                        <div class="symbol">☀️</div>
                        <p class="label">UV Index</p>
                        <div class="value" id="uv">--</div>
                    </div>

                    <div class="detail-item">
                        <div class="symbol">🌧️</div>
                        <p class="label">Precipitation</p>
                        <div class="value" id="rain">--</div>
                    </div>

                </div>

                <!-- Sunrise and sunset -->
                <div class="sun-panel">

                    <div class="sun-item">
                        <p>🌅 Sunrise</p>
                        <h3 id="sunrise">--</h3>
                    </div>

                    <div class="sun-item">
                        <p>🌇 Sunset</p>
                        <h3 id="sunset">--</h3>
                    </div>

                </div>
            </section>

        </div>

    </div>

    <footer>
        Powered by <span>Open-Meteo</span> · Weather information for everyone.
    </footer>

</div>

<script>

/* ================= ELEMENTS ================= */

const form = document.getElementById("search-form");
const input = document.getElementById("city-input");
const message = document.getElementById("message");
const button = document.getElementById("search-btn");
const locationButton = document.getElementById("location-btn");
const appContent = document.getElementById("app-content");

document.getElementById("today").textContent =
    new Intl.DateTimeFormat("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    }).format(new Date());


/* ================= WEATHER CONDITIONS ================= */

// Convert Open-Meteo weather codes into descriptions and emojis.

function getWeather(code, isDay = 1) {

    if (code === 0) {
        return isDay
            ? { text: "Clear Sky", icon: "☀️" }
            : { text: "Clear Night", icon: "🌙" };
    }

    if (code === 1) return { text: "Mainly Clear", icon: "🌤️" };
    if (code === 2) return { text: "Partly Cloudy", icon: "⛅" };
    if (code === 3) return { text: "Overcast", icon: "☁️" };

    if ([45, 48].includes(code))
        return { text: "Foggy", icon: "🌫️" };

    if ([51, 53, 55, 56, 57].includes(code))
        return { text: "Drizzle", icon: "🌦️" };

    if ([61, 63, 65, 66, 67].includes(code))
        return { text: "Rain", icon: "🌧️" };

    if ([71, 73, 75, 77].includes(code))
        return { text: "Snow", icon: "❄️" };

    if ([80, 81, 82].includes(code))
        return { text: "Rain Showers", icon: "🌧️" };

    if ([85, 86].includes(code))
        return { text: "Snow Showers", icon: "🌨️" };

    if ([95, 96, 99].includes(code))
        return { text: "Thunderstorm", icon: "⛈️" };

    return { text: "Unknown", icon: "🌡️" };
}


/* ================= API REQUESTS ================= */

// Find a city using its name.

async function searchCity(city) {

    const url =
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("Unable to search for this city.");
    }

    const data = await response.json();

    if (!data.results || data.results.length === 0) {
        throw new Error("City not found. Please check the spelling.");
    }

    return data.results[0];
}


// Get current weather, hourly forecast and daily forecast.

async function getWeather(latitude, longitude) {

    const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&forecast_days=5&timezone=auto`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("Weather information is unavailable.");
    }

    return await response.json();
}


/* ================= TIME HELPERS ================= */

// Convert API local time into a readable time.

function formatTime(dateString) {

    return new Date(dateString).toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        timeZone: "UTC"
    });
}


// Format a day from the API date.

function formatDay(dateString) {

    return new Date(dateString + "T12:00:00Z")
        .toLocaleDateString("en-US", {
            weekday: "long",
            timeZone: "UTC"
        });
}


/* ================= CURRENT WEATHER ================= */

function displayCurrent(city, data) {

    const current = data.current;
    const today = data.daily;
    const weather = getWeather(current.weather_code, current.is_day);

    document.getElementById("city-name").textContent =
        `📍 ${city.name}, ${city.country}`;

    document.getElementById("temperature").textContent =
        `${Math.round(current.temperature_2m)}°`;

    document.getElementById("condition").textContent =
        weather.text;

    document.getElementById("main-icon").textContent =
        weather.icon;

    document.getElementById("feels").textContent =
        `Feels like ${Math.round(current.apparent_temperature)}°C`;

    document.getElementById("local-time").textContent =
        "Local time: " + formatTime(current.time);

    document.getElementById("humidity").textContent =
        `${current.relative_humidity_2m}%`;

    document.getElementById("wind").textContent =
        `${current.wind_speed_10m} km/h`;

    document.getElementById("uv").textContent =
        today.uv_index_max[0];

    document.getElementById("rain").textContent =
        `${current.precipitation} mm`;

    document.getElementById("sunrise").textContent =
        formatTime(today.sunrise[0]);

    document.getElementById("sunset").textContent =
        formatTime(today.sunset[0]);
}


/* ================= HOURLY FORECAST ================= */

function displayHourly(data) {

    const hourly = document.getElementById("hourly");
    hourly.innerHTML = "";

    const currentHour = data.current.time.slice(0, 13);

    // Find the current hour in the API response.
    let start = data.hourly.time.findIndex(time =>
        time.startsWith(currentHour)
    );

    if (start < 0) start = 0;

    // Show the next eight hours.
    for (let i = start; i < start + 8; i++) {

        if (i >= data.hourly.time.length) break;

        const time = data.hourly.time[i];
        const temp = data.hourly.temperature_2m[i];
        const code = data.hourly.weather_code[i];
        const rain = data.hourly.precipitation_probability[i];

        const weather = getWeather(code);

        const hourLabel = i === start
            ? "Now"
            : formatTime(time);

        const card = document.createElement("div");
        card.className = "hour-card";

        const timeElement = document.createElement("p");
        timeElement.textContent = hourLabel;

        const iconElement = document.createElement("div");
        iconElement.className = "hour-icon";
        iconElement.textContent = weather.icon;

        const tempElement = document.createElement("div");
        tempElement.className = "hour-temp";
        tempElement.textContent = `${Math.round(temp)}°`;

        const rainElement = document.createElement("p");
        rainElement.textContent = `💧 ${rain ?? 0}%`;

        card.append(timeElement, iconElement, tempElement, rainElement);
        hourly.appendChild(card);
    }
}


/* ================= 5-DAY FORECAST ================= */

function displayForecast(data) {

    const forecast = document.getElementById("forecast");
    forecast.innerHTML = "";

    data.daily.time.forEach((date, index) => {

        const weather = getWeather(data.daily.weather_code[index]);

        const row = document.createElement("div");
        row.className = "forecast-row";

        const day = document.createElement("span");
        day.className = "day";
        day.textContent = index === 0 ? "Today" : formatDay(date);

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = weather.icon;

        const condition = document.createElement("span");
        condition.className = "condition-text";
        condition.textContent = weather.text;

        const temps = document.createElement("span");
        temps.className = "temps";
        temps.textContent =
            `${Math.round(data.daily.temperature_2m_max[index])}° / ${Math.round(data.daily.temperature_2m_min[index])}°`;

        row.append(day, icon, condition, temps);
        forecast.appendChild(row);
    });
}


/* ================= MAIN SEARCH ================= */

async function loadWeather(latitude, longitude, city) {

    try {

        message.textContent = "Getting the latest weather...";
        appContent.hidden = true;

        const data = await getWeather(latitude, longitude);

        // Display all weather sections.
        displayCurrent(city, data);
        displayHourly(data);
        displayForecast(data);

        appContent.hidden = false;
        message.textContent = "";

    } catch (error) {

        message.textContent = error instanceof TypeError
            ? "Connection problem. Check your internet and try again."
            : error.message;

        appContent.hidden = true;
    }
}


async function searchWeather(cityName) {

    if (!cityName.trim()) {
        message.textContent = "Please enter a city name.";
        return;
    }

    button.disabled = true;
    button.textContent = "Loading...";

    try {

        const city = await searchCity(cityName);

        await loadWeather(
            city.latitude,
            city.longitude,
            city
        );

    } catch (error) {

        message.textContent = error instanceof TypeError
            ? "Internet connection problem. Please try again."
            : error.message;

        appContent.hidden = true;

    } finally {

        button.disabled = false;
        button.textContent = "Search ↗";
    }
}


/* ================= SEARCH EVENTS ================= */

// Search by clicking the button or pressing Enter.

form.addEventListener("submit", event => {

    event.preventDefault();

    searchWeather(input.value.trim());

});


/* ================= CURRENT LOCATION ================= */

// Use the browser's location permission.

locationButton.addEventListener("click", () => {

    if (!navigator.geolocation) {
        message.textContent = "Geolocation is not supported by your browser.";
        return;
    }

    locationButton.disabled = true;
    message.textContent = "Finding your location...";

    navigator.geolocation.getCurrentPosition(

        async position => {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // Reverse geocoding to get a readable city name.
            try {

                const url =
                    `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${latitude}&longitude=${longitude}&language=en&format=json`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Could not identify your location.");
                }

                const result = await response.json();

                const city = result.results?.[0] || {
                    name: "Your Location",
                    country: ""
                };

                await loadWeather(latitude, longitude, city);

            } catch (error) {

                message.textContent = error instanceof TypeError
                    ? "Internet connection problem."
                    : error.message;
            }

            locationButton.disabled = false;
        },

        error => {

            message.textContent =
                error.code === 1
                    ? "Location permission denied. Please allow location access."
                    : "Unable to get your location. Try searching for a city.";

            locationButton.disabled = false;
        },

        {
            enableHighAccuracy: false,
            timeout: 10000
        }

    );
});


/* ================= DEFAULT CITY ================= */

// Show Mumbai weather when the app first opens.

searchWeather("Mumbai");

</script>

</body>
</html>
